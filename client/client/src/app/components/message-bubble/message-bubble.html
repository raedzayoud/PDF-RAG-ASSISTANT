<div class="row" [class.user]="isUser()">
  <div class="avatar" aria-hidden="true">
    @if (isUser()) {
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4.42 0-8 2.24-8 5v3h16v-3c0-2.76-3.58-5-8-5Z" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path d="M19.5 5.5 13.9 4l-1.4 1.4L11 4 5.4 5.5 4 11l1.4 1.4L4 13.9 5.5 19.5 11 21l1.4-1.4L13.9 21l5.6-1.5 1.5-5.6L19.5 12.4 21 11Z" transform="scale(0.85) translate(1.8 1.8)" />
      </svg>
    }
  </div>

  <div class="bubble">
    <div class="content">{{ message().content }}</div>

    @if (hour()) {
      <time class="time">{{ hour() }}</time>
    }
  </div>
</div>
